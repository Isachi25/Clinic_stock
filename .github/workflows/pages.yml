name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-pages:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check.outputs.pages_enabled }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request("GET /repos/{owner}/{repo}/pages", {
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput("pages_enabled", "true");
            } catch (error) {
              if (error.status === 404) {
                core.info("Skipping deployment because GitHub Pages is not enabled.");
                core.setOutput("pages_enabled", "false");
              } else {
                throw error;
              }
            }

  build:
    needs: check-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /Clinic_stock/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [check-pages, build]
    if: needs.check-pages.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
